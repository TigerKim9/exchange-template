version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-exchange-db
    environment:
      POSTGRES_DB: crypto_exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exchange-network

  backend:
    build: ./backend
    container_name: crypto-exchange-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/crypto_exchange
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - exchange-network

  frontend:
    build: ./frontend
    container_name: crypto-exchange-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - exchange-network

volumes:
  postgres_data:

networks:
  exchange-network:
    driver: bridge
